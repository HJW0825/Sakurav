<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-color: #ccc;
        }

        .box {
            width: 400px;
            height: 400px;
            margin: 100px auto;
        }

        .box_1 {
            width: 200px;
            height: 400px;
            background-color: black;
            border-radius: 200px 0 0 200px;
            float: left;
            position: relative;
        }


        .box_2 {
            width: 200px;
            height: 400px;
            background-color: #fff;
            border-radius: 0 200px 200px 0;
            float: left;
            position: relative;
        }

        .tp {
            width: 200px;
            height: 200px;
            background-color: black;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 106px;
            z-index: 1;
        }

        .xiao_tp {
            width: 50px;
            height: 50px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 73px;
            left: 70px;
        }

        .bt {
            width: 200px;
            height: 200px;
            background-color: rgb(252, 252, 252);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left: -99px;
            z-index: 1;
        }

        .xiao_bt {
            width: 50px;
            height: 50px;
            background-color: #000000;
            border-radius: 50%;
            position: absolute;
            top: 73px;
            left: 70px;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="box_1">
            <div class="tp">
                <div class="xiao_tp"></div>
            </div>
        </div>
        <div class="box_2">
            <div class="bt">
                <div class="xiao_bt"></div>
            </div>
        </div>
    </div>
</body>

</html>
