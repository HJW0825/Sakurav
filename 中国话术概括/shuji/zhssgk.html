<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>《中国术数概括》</title>
	</head>
	<body>

	  <!-- 返回按钮（仅UI） -->
	    <a href="../feed.html"><div class="back-btn">←</div></a>
	    <!-- 全屏图片容器 -->
	    <div class="img-box">
	        <img id="switchImg" src="../fonts/zgssgk.jpg" alt="点击切换">
	    </div>
	
	    <script>
	        // 图片列表（保持不变）
	        const imgList = [
	            "../fonts/zgssgk/01%20%20(1).png",
	            "../fonts/zgssgk/01%20%20(2).png",
	            "../fonts/zgssgk/01%20%20(3).png",
	            "../fonts/zgssgk/01%20%20(4).png",
	            "../fonts/zgssgk/01%20%20(5).png",
	            "../fonts/zgssgk/01%20%20(6).png",
	            "../fonts/zgssgk/01%20%20(7).png",
	            "../fonts/zgssgk/01%20%20(8).png",
	            "../fonts/zgssgk/01%20%20(9).png",
	            "../fonts/zgssgk/01%20%20(10).png",
	            "../fonts/zgssgk/01%20%20(11).png",
	            "../fonts/zgssgk/01%20%20(12).png"
	        ];
	
	        let currentIndex = 0;
	        const imgElement = document.getElementById("switchImg");
	
	        // 点击切换图片功能（完全不变）
	        imgElement.addEventListener("click", function() {
	            currentIndex++;
	            if (currentIndex >= imgList.length) {
	                currentIndex = 0;
	            }
	            imgElement.src = imgList[currentIndex];
	        });
	    </script>

	</body>
</html>

<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 全屏基础样式 */
        body {
            background-color: #F9F2E3;
            /* 取消页面边距，实现全屏 */
            margin: 0;
            overflow: hidden;
        }
        /* 图片容器：全屏铺满 */
        .img-box {
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
			margin-top: 50%;
        }
        /* 点击缩放效果保留 */
        .img-box:active {
            transform: scale(0.98);
        }
        /* 图片全屏铺满，不变形 */
        #switchImg {
            /* 铺满屏幕并裁剪多余部分，保证全屏 */
            object-fit: cover;
        }

        /* ========== 返回按钮（仅UI，无功能） ========== */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(74, 20, 140, 0.8);
            border: 2px solid #D4AF37;
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 悬浮在图片最上方 */
            z-index: 999;
        }
    </style>
